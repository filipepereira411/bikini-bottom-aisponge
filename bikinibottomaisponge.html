<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bikini Bottom em HTML/CSS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: linear-gradient(to bottom, #4ea1d3 0%, #2f6690 70%, #16324f 100%);
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            position: relative;
        }

        /* Chão de Areia */
        .sand {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 25vh;
            background: #eec590;
            border-top: 10px solid #deab68;
            border-radius: 50% 50% 0 0 / 20px 20px 0 0;
            z-index: 5;
        }

        /* Flores de Nuvem Clássicas */
        .sky-flower {
            position: absolute;
            background: rgba(234, 182, 222, 0.4);
            border-radius: 50%;
            animation: float-flower 20s infinite ease-in-out;
        }
        .sky-flower::before, .sky-flower::after {
            content: '';
            position: absolute;
            background: rgba(234, 182, 222, 0.4);
            border-radius: 50%;
            width: 100%;
            height: 100%;
        }
        .sky-flower::before { top: -50%; left: 30%; }
        .sky-flower::after { top: 40%; left: -40%; }

        .flower1 { width: 120px; height: 80px; top: 10%; left: 15%; animation-delay: 0s; }
        .flower2 { width: 160px; height: 100px; top: 15%; right: 20%; background: rgba(185, 226, 142, 0.4); }
        .flower2::before, .flower2::after { background: rgba(185, 226, 142, 0.4); }

        /* Animações */
        @keyframes float-flower {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        /* Contentor do Bairro */
        .neighborhood {
            position: absolute;
            bottom: 12vh;
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            padding: 0 10%;
            z-index: 10;
        }

        /* --- 1. CASA DO PATRICK --- */
        .patricks-rock {
            width: 140px;
            height: 100px;
            background: #8a624a;
            border-radius: 150px 150px 0 0;
            position: relative;
            border: 4px solid #634331;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .patricks-rock:hover { transform: scale(1.05); }
        .antenna {
            position: absolute;
            top: -25px;
            left: 50%;
            width: 8px;
            height: 30px;
            background: #523829;
            transform: translateX(-50%) rotate(15deg);
        }

        /* --- 2. CASA DO SQUIDWARD --- */
        .squidwards-house {
            width: 160px;
            height: 280px;
            background: #3a506b;
            border-radius: 80px 80px 10px 10px;
            position: relative;
            border: 5px solid #1c2541;
        }
        /* Olhos (Janelas) */
        .squid-eye {
            position: absolute;
            top: 50px;
            width: 40px;
            height: 40px;
            background: #ffea00;
            border: 4px solid #1c2541;
            border-radius: 50%;
        }
        .squid-eye.left { left: 25px; }
        .squid-eye.right { right: 25px; }
        /* Nariz */
        .squid-nose {
            position: absolute;
            top: 95px;
            left: 50%;
            width: 34px;
            height: 70px;
            background: #2a3c50;
            border: 4px solid #1c2541;
            border-radius: 0 0 20px 20px;
            transform: translateX(-50%);
        }
        /* Porta */
        .squid-door {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 45px;
            height: 70px;
            background: #b56576;
            border: 4px solid #1c2541;
            border-radius: 20px 20px 0 0;
            transform: translateX(-50%);
        }

        /* --- 3. ANANÁS DO SPONGEBOB --- */
        .pineapple-house {
            width: 180px;
            height: 290px;
            background: #ff9f1c;
            border-radius: 50% 50% 40% 40% / 60% 60% 40% 40%;
            position: relative;
            border: 5px solid #e76f51;
            overflow: visible;
        }
        /* Linhas cruzadas do ananás */
        .pineapple-house::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                linear-gradient(45deg, transparent 48%, #e76f51 49%, #e76f51 51%, transparent 52%),
                linear-gradient(-45deg, transparent 48%, #e76f51 49%, #e76f51 51%, transparent 52%);
            background-size: 40px 40px;
            opacity: 0.4;
            pointer-events: none;
        }
        /* Folhas Pretas/Verdes no Topo */
        .leaves {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            z-index: 6;
        }
        .leaf {
            width: 25px;
            height: 70px;
            background: #2a9d8f;
            border: 4px solid #1d645d;
            border-radius: 100% 0% 100% 0% / 100% 0% 100% 0% ;
            transform: rotate(-15deg);
        }
        .leaf:nth-child(2) { transform: translateY(-15px) rotate(0deg); height: 80px; }
        .leaf:nth-child(3) { transform: rotate(15deg); border-radius: 0% 100% 0% 100% / 0% 100% 0% 100%; }
        /* Janelas Porthole */
        .sponge-window {
            position: absolute;
            width: 35px;
            height: 35px;
            background: #a8dadc;
            border: 4px solid #457b9d;
            border-radius: 50%;
            top: 80px;
        }
        .window-left { left: 25px; }
        .window-right { right: 25px; top: 140px; }
        /* Porta de Caracol */
        .sponge-door {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 50px;
            height: 85px;
            background: #74c69d;
            border: 4px solid #40916c;
            border-radius: 25px 25px 0 0;
            transform: translateX(-50%);
            z-index: 2;
        }

        /* Bolhas de Água Coadjuvantes */
        .bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            bottom: -10px;
            animation: rise 12s infinite linear;
        }
        @keyframes rise {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-105vh) translateX(50px); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Elementos do céu/mar de Bikini Bottom -->
    <div class="sky-flower flower1"></div>
    <div class="sky-flower flower2"></div>

    <!-- Bolhas animadas automáticas -->
    <div class="bubble" style="width:20px; height:20px; left:10%; animation-duration: 8s;"></div>
    <div class="bubble" style="width:35px; height:35px; left:45%; animation-duration: 11s; animation-delay: 2s;"></div>
    <div class="bubble" style="width:15px; height:15px; left:75%; animation-duration: 9s; animation-delay: 5s;"></div>

    <!-- O Bairro da Rua da Concha -->
    <div class="neighborhood">
        
        <!-- Casa do Patrick -->
        <div class="patricks-rock" title="Casa do Patrick!">
            <div class="antenna"></div>
        </div>

        <!-- Casa do Squidward -->
        <div class="squidwards-house" title="Casa do Squidward">
            <div class="squid-eye left"></div>
            <div class="squid-eye right"></div>
            <div class="squid-nose"></div>
            <div class="squid-door"></div>
        </div>

        <!-- Casa de Ananás do SpongeBob -->
        <div class="pineapple-house" title="Casa do SpongeBob!">
            <div class="leaves">
                <div class="leaf"></div>
                <div class="leaf"></div>
                <div class="leaf"></div>
            </div>
            <div class="sponge-window window-left"></div>
            <div class="sponge-window window-right"></div>
            <div class="sponge-door"></div>
        </div>

    </div>

    <!-- Chão arenoso -->
    <div class="sand"></div>

</body>
</html>
