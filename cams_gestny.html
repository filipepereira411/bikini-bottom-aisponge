<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câmara Web | Captura Direta</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8f9fa; color: #333333; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .camera-container { background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 680px; text-align: center; border: 1px solid #e0e0e0; }
        h1 { color: #20c997; font-size: 1.6rem; margin-bottom: 20px; }
        
        .video-box { position: relative; width: 100%; background: #212529; border-radius: 8px; overflow: hidden; aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* Classes de Rotação e Espelho */
        .mirror { transform: scaleX(-1); }
        .rotate-90 { transform: rotate(90deg); }
        .rotate-180 { transform: rotate(180deg); }
        .rotate-270 { transform: rotate(270deg); }

        .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        button { background-color: #212529; color: #ffffff; border: none; padding: 12px 24px; border-radius: 6px; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; }
        button:hover { background-color: #343a40; }
        button:disabled { background-color: #ced4da; color: #6c757d; cursor: not-allowed; }
        
        .btn-toggle { background-color: #20c997; }
        .btn-toggle:hover { background-color: #1aa179; }
        .btn-danger { background-color: #dc3545; }
        .btn-danger:hover { background-color: #bb2d3b; }
        
        .status-badge { position: absolute; top: 15px; left: 15px; background: rgba(220, 53, 69, 0.9); color: #fff; padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; letter-spacing: 0.05em; display: none; }
        .placeholder { color: #6c757d; position: absolute; font-weight: 500; }
        #canvas-processing { display: none; }
    </style>
</head>
<body>

    <div class="camera-container">
        <h1>Consola de Câmara</h1>
        
        <div class="video-box">
            <div id="status-badge" class="status-badge">GRAVANDO</div>
            <video id="webcam" autoplay playsinline></video>
            <span id="placeholder-text" class="placeholder">Câmara Desligada</span>
        </div>

        <div class="controls">
            <button id="btn-toggle" class="btn-toggle" onclick="alternarCamara()">Ligar Câmara</button>
            <button id="btn-snap" onclick="tirarFoto()" disabled>📸 Foto</button>
            <button id="btn-record" class="btn-danger" onclick="alternarGravacao()" disabled>🔴 Gravar</button>
            <button id="btn-rotate" onclick="rodarCamara()" disabled>🔄 Rodar / Espelhar</button>
        </div>
    </div>

    <!-- Canvas oculto para capturar e processar os frames com a rotação correta -->
    <canvas id="canvas-processing" width="640" height="480"></canvas>

    <script>
        let streamAtivo = null;
        let mediaRecorder = null;
        let fragmentosVideo = [];
        let gravando = false;
        
        const classesOrientacao = ['normal', 'mirror', 'rotate-90', 'rotate-180', 'rotate-270'];
        let indiceOrientacao = 0;

        const video = document.getElementById('webcam');
        const placeholder = document.getElementById('placeholder-text');
        const statusBadge = document.getElementById('status-badge');
        const canvas = document.getElementById('canvas-processing');

        const btnToggle = document.getElementById('btn-toggle');
        const btnSnap = document.getElementById('btn-snap');
        const btnRecord = document.getElementById('btn-record');
        const btnRotate = document.getElementById('btn-rotate');

        // Ligar e Desligar o fluxo de vídeo
        async function alternarCamara() {
            if (streamAtivo) {
                desligarCamara();
            } else {
                try {
                    streamAtivo = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    video.srcObject = streamAtivo;
                    placeholder.style.display = 'none';
                    atualizarBotoes(true);
                } catch (err) {
                    alert("Impossível aceder à câmara ou ao microfone: " + err.message);
                }
            }
        }

        function desligarCamara() {
            if (gravando) alternarGravacao();
            if (streamAtivo) {
                streamAtivo.getTracks().forEach(track => track.stop());
                streamAtivo = null;
            }
            video.srcObject = null;
            placeholder.style.display = 'block';
            atualizarBotoes(false);
        }

        function atualizarBotoes(ativo) {
            if (ativo) {
                btnToggle.innerText = "Desligar Câmara";
                btnToggle.style.backgroundColor = "#dc3545";
                btnSnap.disabled = false;
                btnRecord.disabled = false;
                btnRotate.disabled = false;
            } else {
                btnToggle.innerText = "Ligar Câmara";
                btnToggle.style.backgroundColor = "#20c997";
                btnSnap.disabled = true;
                btnRecord.disabled = true;
                btnRotate.disabled = true;
            }
        }

        // Rodar e espelhar o stream CSS visualmente
        function rodarCamara() {
            indiceOrientacao = (indiceOrientacao + 1) % classesOrientacao.length;
            video.className = classesOrientacao[indiceOrientacao];
        }

        // Capturar Foto e descarregar diretamente no armazenamento
        function tirarFoto() {
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            
            ctx.save();
            
            // Replicar no canvas final a transformação aplicada no CSS
            const orientacaoAtual = classesOrientacao[indiceOrientacao];
            if (orientacaoAtual === 'mirror') {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            } else if (orientacaoAtual === 'rotate-90') {
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.rotate(90 * Math.PI / 180);
                ctx.translate(-canvas.height / 2, -canvas.width / 2);
            } else if (orientacaoAtual === 'rotate-180') {
                ctx.translate(canvas.width, canvas.height);
                ctx.rotate(180 * Math.PI / 180);
            } else if (orientacaoAtual === 'rotate-270') {
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.rotate(270 * Math.PI / 180);
                ctx.translate(-canvas.height / 2, -canvas.width / 2);
            }
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            ctx.restore();

            const dataUrl = canvas.toDataURL('image/png');
            
            // Disparar download automático
            const link = document.createElement('a');
            link.href = dataUrl;
            link.download = `foto_${Date.now()}.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Gravar fluxo de Vídeo e descarregar no fim
        function alternarGravacao() {
            if (!gravando) {
                fragmentosVideo = [];
                mediaRecorder = new MediaRecorder(streamAtivo, { mimeType: 'video/webm' });
                
                mediaRecorder.ondataavailable = e => {
                    if (e.data.size > 0) fragmentosVideo.push(e.data);
                };
                
                mediaRecorder.onstop = () => {
                    const blob = new Blob(fragmentosVideo, { type: 'video/webm' });
                    const urlVideo = URL.createObjectURL(blob);
                    
                    // Disparar download automático
                    const link = document.createElement('a');
                    link.href = urlVideo;
                    link.download = `video_${Date.now()}.webm`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                };

                mediaRecorder.start();
                gravando = true;
                btnRecord.innerText = "⏹️ Parar";
                statusBadge.style.display = 'block';
            } else {
                mediaRecorder.stop();
                gravando = false;
                btnRecord.innerText = "🔴 Gravar";
                statusBadge.style.display = 'none';
            }
        }
    </script>
</body>
</html>
